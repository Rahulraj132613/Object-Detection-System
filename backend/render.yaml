services:
  - type: web
    name: ai-object-detection-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: PORT
        value: 8000
      - key: DEBUG
        value: "false"
      - key: YOLO_MODEL
        value: yolov8n.pt
      - key: ALLOWED_ORIGINS
        value: "http://localhost:3000,https://*.vercel.app"
